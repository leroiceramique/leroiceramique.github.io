services:
  - type: web
    name: telegram-inventory-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: PORT
        value: "10000"
      # Email backup (optional - for daily auto-backup via email)
      # - key: SMTP_HOST
      #   value: "smtp.gmail.com"
      # - key: SMTP_PORT
      #   value: "587"
      # - key: SMTP_EMAIL
      #   sync: false
      # - key: SMTP_PASSWORD
      #   sync: false
      # - key: BACKUP_EMAIL
      #   sync: false
    healthCheckPath: /health
